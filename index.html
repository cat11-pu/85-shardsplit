<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>shardsplit</title>
<style>body{font-family:system-ui,sans-serif;margin:24px}pre{background:#f6f6f6;padding:10px;border-radius:6px}button{padding:6px 12px;margin-right:8px}</style>
</head>
<body>
<h1>shardsplit 服务</h1>
<button onclick="call('/stats')">看状态</button>
<button onclick="call('/probe')">发一次请求</button>
<pre id="out">点上面的按钮，接口结果会打在这里（同一个服务的真实 HTTP 响应）。</pre>
<script>
async function call(path, method) {
  const response = await fetch(path, { method: method || "GET" });
  document.getElementById("out").textContent = path + " -> HTTP " + response.status + "\n" + (await response.text());
}
</script>
</body>
</html>
